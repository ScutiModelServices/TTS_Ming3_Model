# Ming dense 0.5B; NVIDIA GPU required. Shared cache is never cleaned.
name: tts_ming3_model

services:
  tts_ming3_model:
    build: .
    image: tts_ming3_model:latest
    restart: unless-stopped
    mem_limit: ${SERVICE_MEM_LIMIT:-0}  # 0 = no cap; a cap makes an out-of-memory kill stay inside this container
    environment:
      SERVICE_ADMIN_PASSWORD: ${SERVICE_ADMIN_PASSWORD:-}
      SERVICE_NUM_THREAD: ${SERVICE_NUM_THREAD:-}
      SERVICE_MAX_INFLIGHT: ${SERVICE_MAX_INFLIGHT:-0}
      SERVICE_REPLICAS: ${SERVICE_REPLICAS:-1}  # shown read-only on /admin/
    volumes:
      - type: bind
        source: ${SERVICE_MODELS_DIR:-../../.cache/huggingface}
        target: /models
        bind:
          create_host_path: true
      - tts_ming3_model_voices:/voices
      - tts_ming3_model_data:/data
    deploy:
      replicas: ${SERVICE_REPLICAS:-1}
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:29324/health')"]
      interval: 15s
      timeout: 5s
      start_period: 300s
    networks: [tts_ming3_model]

  tts_ming3_model_lb:
    container_name: tts_ming3_model_lb
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${SERVICE_PORT:-29324}:29324"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      tts_ming3_model:
        condition: service_healthy
    networks:
      tts_ming3_model:
      citadel:
        aliases: [tts_ming3_model_lb]

volumes:
  tts_ming3_model_voices:
    name: tts_ming3_model_voices
  tts_ming3_model_data:
    name: tts_ming3_model_data
networks:
  # Other stacks reach http://tts_ming3_model_lb:29324 by joining this network.
  tts_ming3_model:
    name: tts_ming3_model
  citadel:
    name: citadel_core
    external: true
