# Load balancer in front of the tts_ming3_model replicas. Docker DNS gives `tts_ming3_model` one address per replica;
# nginx reads them at start, so restart this container after changing the replica count.
upstream tts_ming3_model {
    least_conn;
    server tts_ming3_model:29324 max_fails=2 fail_timeout=10s;
}

server {
    listen 29324;
    client_max_body_size 16m;  # a reference clip uploaded as base64 (up to 10 MB of WAV)

    location / {
        proxy_pass http://tts_ming3_model;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Internal-Token $http_x_internal_token;
        proxy_read_timeout 300s;
        # A speak call with a seed is a pure function of its body; one without is random anyway, so another replica may repeat it after a connection error.
        proxy_next_upstream error http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}
