[project]
name = "tts_ming3_model"
version = "0.1.0"
description = "Shared HTTP and admin API for Ming dense 0.5B speech synthesis"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
dependencies = ["python-dotenv==1.2.2", "fastapi>=0.115", "uvicorn>=0.30", "huggingface-hub>=0.26,<1"]

[project.optional-dependencies]
inference = [
    "torch==2.6.0", "torchaudio==2.6.0", "transformers==4.46.3", "accelerate==1.3.0",
    "numpy>=1.26,<3", "soundfile==0.12.1", "tqdm", "loguru", "x-transformers==2.9.2",
    "diffusers==0.33.0", "onnxruntime", "inflect", "einops", "packaging",
]
normalization = ["pynini==2.1.6; sys_platform == 'linux'"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.40"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["cloning_off: run with the shipped setting, voice cloning disabled"]
